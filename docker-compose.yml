services:
  garza-bot:
    image: python:3.12-slim
    container_name: garza-bot
    network_mode: host
    restart: unless-stopped
    # Da tiempo a on_shutdown a apagar los enchufes antes de matar el proceso
    stop_grace_period: 30s

    env_file: .env

    environment:
      REPO_URL: ${REPO_URL}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      ALLOWED_USER_ID: ${ALLOWED_USER_ID}
      DEVICES_JSON: ${DEVICES_JSON}
      DATA_DIR: /app/data
      TZ: Europe/Madrid

    working_dir: /app/repo

    volumes:
      # Persistencia de schedules.json (y opcionalmente config local)
      - ${DATA_PATH:-./data}:/app/data

    command: >
      sh -c "set -e &&
        apt-get update -qq &&
        apt-get install -y --no-install-recommends git &&
        if [ ! -d /app/repo/.git ]; then
          rm -rf /app/repo && git clone --depth 1 $${REPO_URL} /app/repo;
        else
          cd /app/repo && git pull --ff-only;
        fi &&
        cd /app/repo &&
        pip install --no-cache-dir -q -r requirements.txt &&
        python bot.py
      "
